name: 🐛 Bug Report
description: Report something that's broken or behaving unexpectedly
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill out the sections below.
        For security issues, do **not** open a public issue — see `SECURITY.md`.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-sentence description of the problem.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered, specific steps. Include the exact route, payload, or UI action.
      placeholder: |
        1. Log in as demo@chatapp.com
        2. Open conversation with Alice
        3. Paste an image into the composer
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / OS
      placeholder: Chrome 130, macOS 14
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Server runtime
      placeholder: Node 20 / Bun 1.1 / Docker
  - type: textarea
    id: logs
    attributes:
      label: Logs & errors
      description: Browser console errors, server logs, or stack traces. Redact secrets.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / recordings
      description: Drag-and-drop images or paste a Loom/asciinema link.
  - type: dropdown
    id: regression
    attributes:
      label: Is this a regression?
      options:
        - "Yes — it used to work"
        - "No — never worked"
        - "Not sure"
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Confirm
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I have redacted any secrets / PII from logs and screenshots
          required: true
