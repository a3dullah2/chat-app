name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKIP_E2E: "1"
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔧 Generate Prisma client
        run: bun run db:generate

      - name: 🧹 Lint
        run: bun run lint

      - name: 🧪 Unit tests
        run: bun run test

      - name: 📊 Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: |
            coverage/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    env:
      SKIP_E2E: "1"
      DATABASE_URL: "file:./db/ci-build.db"
      JWT_SECRET: "ci-build-secret-do-not-use-in-prod-32chars!"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      INTERNAL_SOCKET_TOKEN: "ci-internal-emit-token"
      MAX_UPLOAD_MB: "25"
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔧 Generate Prisma client
        run: bun run db:generate

      - name: 🏗️ Push schema
        run: bun run db:push

      - name: 🌱 Seed
        run: bun run db:seed

      - name: 🚀 Build
        run: bun run build
